# Redraws the contribution snake at the bottom of the README.
# The SVGs live on the `output` branch so the daily redraw never adds commits to main.
name: Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#4d7c0f&color_dots=#ebedf0,#d9f99d,#bef264,#84cc16,#4d7c0f
            dist/snake-dark.svg?palette=github-dark&color_snake=#cbfa55&color_dots=#161b22,#2b3a12,#4f6b1c,#8fb832,#cbfa55

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
